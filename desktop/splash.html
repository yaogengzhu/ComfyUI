<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ComfyUI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            -webkit-app-region: drag;
        }
        
        .splash-container {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            border-radius: 20px;
            padding: 40px 50px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .logo {
            font-size: 48px;
            margin-bottom: 10px;
        }
        
        .title {
            color: #fff;
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .subtitle {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            margin-bottom: 30px;
        }
        
        .loader {
            width: 200px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            margin: 0 auto 15px;
            overflow: hidden;
        }
        
        .loader-bar {
            height: 100%;
            width: 30%;
            background: linear-gradient(90deg, #e94560, #ff6b8a);
            border-radius: 2px;
            animation: loading 1.5s ease-in-out infinite;
        }
        
        @keyframes loading {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(400%); }
        }
        
        .status {
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
        }
        
        .version {
            position: absolute;
            bottom: 15px;
            right: 20px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 11px;
        }
    </style>
</head>
<body>
    <div class="splash-container">
        <div class="logo">🎨</div>
        <div class="title">ComfyUI</div>
        <div class="subtitle">强大的 AI 图像生成平台</div>
        <div class="loader">
            <div class="loader-bar"></div>
        </div>
        <div class="status" id="status">正在启动...</div>
    </div>
    <div class="version">v1.0.0</div>
    
    <script>
        const { ipcRenderer } = require('electron');
        
        ipcRenderer.on('status', (event, message) => {
            document.getElementById('status').textContent = message;
        });
    </script>
</body>
</html>
