<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ComfyUI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            height: 100%;
            background: #1a1a1a;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        
        /* 顶部终端区域 */
        .terminal {
            flex: 1;
            background: #0d0d0d;
            padding: 12px 16px;
            overflow-y: auto;
            font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Fira Code', monospace;
            font-size: 11px;
            line-height: 1.5;
            color: #a0a0a0;
            border-bottom: 1px solid #333;
        }
        
        .terminal::-webkit-scrollbar {
            width: 8px;
        }
        
        .terminal::-webkit-scrollbar-track {
            background: #1a1a1a;
        }
        
        .terminal::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 4px;
        }
        
        .log-line {
            white-space: pre-wrap;
            word-break: break-all;
        }
        
        .log-line.info { color: #a0a0a0; }
        .log-line.success { color: #4ade80; }
        .log-line.warning { color: #fbbf24; }
        .log-line.error { color: #f87171; }
        .log-line.highlight { color: #60a5fa; }
        .log-line.path { color: #c084fc; }
        
        /* 底部状态区域 */
        .status-area {
            padding: 30px 40px;
            text-align: center;
            background: linear-gradient(180deg, #1a1a1a 0%, #0d0d0d 100%);
        }
        
        .logo {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 24px;
            background: linear-gradient(135deg, #c8ff00 0%, #a0e000 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(200, 255, 0, 0.3);
            font-family: 'Comic Sans MS', cursive, sans-serif;
            letter-spacing: 2px;
        }
        
        .progress-container {
            width: 300px;
            margin: 0 auto 20px;
        }
        
        .progress-bar {
            height: 4px;
            background: #333;
            border-radius: 2px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #c8ff00 0%, #a0e000 100%);
            width: 0%;
            transition: width 0.3s ease;
            animation: progress-glow 2s infinite;
        }
        
        @keyframes progress-glow {
            0%, 100% { box-shadow: 0 0 5px rgba(200, 255, 0, 0.5); }
            50% { box-shadow: 0 0 15px rgba(200, 255, 0, 0.8); }
        }
        
        .status-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #fff;
        }
        
        .status-message {
            font-size: 13px;
            color: #888;
        }
        
        /* 进度指示动画 */
        .progress-fill.indeterminate {
            width: 30%;
            animation: indeterminate 1.5s infinite ease-in-out;
        }
        
        @keyframes indeterminate {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(400%); }
        }
        
        /* 窗口拖拽区域 */
        .drag-region {
            -webkit-app-region: drag;
            height: 28px;
            background: #0d0d0d;
            display: flex;
            align-items: center;
            padding-left: 12px;
        }
        
        .window-controls {
            display: flex;
            gap: 8px;
            -webkit-app-region: no-drag;
        }
        
        .window-btn {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
        }
        
        .window-btn.close { background: #ff5f57; }
        .window-btn.minimize { background: #ffbd2e; }
        .window-btn.maximize { background: #28c940; }
    </style>
</head>
<body>
    <div class="container">
        <!-- macOS 风格标题栏 -->
        <div class="drag-region">
            <div class="window-controls">
                <button class="window-btn close" title="关闭"></button>
                <button class="window-btn minimize" title="最小化"></button>
                <button class="window-btn maximize" title="最大化"></button>
            </div>
        </div>
        
        <!-- 终端输出区域 -->
        <div class="terminal" id="terminal">
            <!-- 日志将动态添加到这里 -->
        </div>
        
        <!-- 底部状态区域 -->
        <div class="status-area">
            <div class="logo">Comfy</div>
            <div class="progress-container">
                <div class="progress-bar">
                    <div class="progress-fill indeterminate" id="progressFill"></div>
                </div>
            </div>
            <div class="status-title" id="statusTitle">Starting ComfyUI</div>
            <div class="status-message" id="statusMessage">Starting ComfyUI server...</div>
        </div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');
        
        const terminal = document.getElementById('terminal');
        const progressFill = document.getElementById('progressFill');
        const statusTitle = document.getElementById('statusTitle');
        const statusMessage = document.getElementById('statusMessage');
        
        // 添加日志行
        function addLog(message, type = 'info') {
            const line = document.createElement('div');
            line.className = `log-line ${type}`;
            line.textContent = message;
            terminal.appendChild(line);
            
            // 自动滚动到底部
            terminal.scrollTop = terminal.scrollHeight;
        }
        
        // 解析日志类型
        function parseLogType(message) {
            if (message.includes('[ERROR]') || message.includes('Error') || message.includes('error')) {
                return 'error';
            }
            if (message.includes('[WARN]') || message.includes('Warning')) {
                return 'warning';
            }
            if (message.includes('[DONE]') || message.includes('successfully') || message.includes('完成')) {
                return 'success';
            }
            if (message.includes('Path:') || message.includes('directory')) {
                return 'path';
            }
            if (message.startsWith('**') || message.includes('ComfyUI')) {
                return 'highlight';
            }
            return 'info';
        }
        
        // 更新状态
        function updateStatus(title, message, progress = null) {
            if (title) statusTitle.textContent = title;
            if (message) statusMessage.textContent = message;
            
            if (progress !== null) {
                progressFill.classList.remove('indeterminate');
                progressFill.style.width = `${progress}%`;
            }
        }
        
        // 初始启动日志
        function addInitialLogs() {
            const startTime = new Date().toISOString().replace('T', ' ').slice(0, 19);
            addLog(`** ComfyUI startup time: ${startTime}`, 'highlight');
            addLog(`** Platform: ${process.platform === 'darwin' ? 'Darwin' : process.platform}`, 'highlight');
        }
        
        // 监听状态更新
        ipcRenderer.on('status', (event, message) => {
            updateStatus(null, message);
        });
        
        // 监听日志
        ipcRenderer.on('log', (event, message) => {
            const type = parseLogType(message);
            addLog(message, type);
        });
        
        // 监听进度
        ipcRenderer.on('progress', (event, data) => {
            if (data.percent !== undefined) {
                updateStatus(data.title, data.message, data.percent);
            } else {
                updateStatus(data.title, data.message);
            }
        });
        
        // 监听错误
        ipcRenderer.on('error', (event, error) => {
            addLog(`[ERROR] ${error}`, 'error');
            updateStatus('启动失败', error);
            progressFill.style.background = '#f87171';
        });
        
        // 初始化
        addInitialLogs();
    </script>
</body>
</html>
