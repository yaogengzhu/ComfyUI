<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>绘智 AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            height: 100%;
            background: #1a1a1a;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            overflow: hidden;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        
        /* ============ macOS 标题栏 ============ */
        .titlebar-mac {
            -webkit-app-region: drag;
            height: 38px;
            background: #0d0d0d;
            display: none; /* 默认隐藏，由 JS 控制 */
            align-items: center;
            padding-left: 78px; /* 为系统交通灯留空间 */
            border-bottom: 1px solid #2a2a2a;
        }
        
        .titlebar-mac.visible {
            display: flex;
        }
        
        .mac-title {
            flex: 1;
            text-align: center;
            font-size: 13px;
            color: #888;
            margin-right: 78px;
        }
        
        /* ============ Windows 标题栏 ============ */
        .titlebar-win {
            -webkit-app-region: drag;
            height: 32px;
            background: #0d0d0d;
            display: none; /* 默认隐藏，由 JS 控制 */
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #2a2a2a;
        }
        
        .titlebar-win.visible {
            display: flex;
        }
        
        .win-title {
            padding-left: 12px;
            font-size: 12px;
            color: #888;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .win-icon {
            width: 16px;
            height: 16px;
            border-radius: 3px;
        }
        
        .win-controls {
            display: flex;
            -webkit-app-region: no-drag;
        }
        
        .win-btn {
            width: 46px;
            height: 32px;
            border: none;
            background: transparent;
            color: #888;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s;
        }
        
        .win-btn:hover {
            background: #333;
        }
        
        .win-btn.close:hover {
            background: #e81123;
            color: #fff;
        }
        
        .win-btn svg {
            width: 10px;
            height: 10px;
        }
        
        /* ============ Linux 标题栏 ============ */
        .titlebar-linux {
            -webkit-app-region: drag;
            height: 36px;
            background: #0d0d0d;
            display: none; /* 默认隐藏，由 JS 控制 */
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #2a2a2a;
        }
        
        .titlebar-linux.visible {
            display: flex;
        }
        
        /* ============ 终端区域 ============ */
        .terminal {
            flex: 1;
            background: #0d0d0d;
            padding: 12px 16px;
            overflow-y: auto;
            font-family: 'SF Mono', 'Monaco', 'Consolas', 'Courier New', monospace;
            font-size: 11px;
            line-height: 1.5;
            color: #a0a0a0;
        }
        
        .terminal::-webkit-scrollbar {
            width: 8px;
        }
        
        .terminal::-webkit-scrollbar-track {
            background: #1a1a1a;
        }
        
        .terminal::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 4px;
        }
        
        .terminal::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
        
        .log-line {
            white-space: pre-wrap;
            word-break: break-all;
            padding: 1px 0;
        }
        
        .log-line.info { color: #a0a0a0; }
        .log-line.success { color: #4ade80; }
        .log-line.warning { color: #fbbf24; }
        .log-line.error { color: #f87171; }
        .log-line.highlight { color: #60a5fa; }
        .log-line.path { color: #c084fc; }
        .log-line.start { color: #38bdf8; }
        
        /* ============ 底部状态区域 ============ */
        .status-area {
            padding: 24px 40px 32px;
            text-align: center;
            background: linear-gradient(180deg, #1a1a1a 0%, #0d0d0d 100%);
            border-top: 1px solid #2a2a2a;
        }
        
        .logo-container {
            margin-bottom: 20px;
        }
        
        .logo-img {
            width: 80px;
            height: 80px;
            border-radius: 16px;
            margin-bottom: 8px;
        }
        
        .logo-text {
            font-size: 28px;
            font-weight: bold;
            background: linear-gradient(135deg, #4facfe 0%, #9b5de5 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .progress-container {
            width: 280px;
            margin: 0 auto 16px;
        }
        
        .progress-bar {
            height: 3px;
            background: #333;
            border-radius: 2px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4facfe 0%, #9b5de5 100%);
            width: 0%;
            transition: width 0.3s ease;
        }
        
        .progress-fill.indeterminate {
            width: 30%;
            animation: indeterminate 1.5s infinite ease-in-out;
        }
        
        @keyframes indeterminate {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(400%); }
        }
        
        .status-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #fff;
        }
        
        .status-message {
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- macOS 标题栏 (使用系统原生交通灯) -->
        <div class="titlebar-mac" id="titlebar-mac">
            <div class="mac-title">绘智 AI</div>
        </div>
        
        <!-- Windows 标题栏 -->
        <div class="titlebar-win" id="titlebar-win">
            <div class="win-title">
                <img class="win-icon" src="assets/icon.png" alt="logo">
                绘智 AI
            </div>
            <div class="win-controls">
                <button class="win-btn" id="win-minimize" title="最小化">
                    <svg viewBox="0 0 10 10"><path d="M0 5h10" stroke="currentColor" stroke-width="1" fill="none"/></svg>
                </button>
                <button class="win-btn" id="win-maximize" title="最大化">
                    <svg viewBox="0 0 10 10"><rect x="0.5" y="0.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1"/></svg>
                </button>
                <button class="win-btn close" id="win-close" title="关闭">
                    <svg viewBox="0 0 10 10"><path d="M1 1l8 8M9 1L1 9" stroke="currentColor" stroke-width="1" fill="none"/></svg>
                </button>
            </div>
        </div>
        
        <!-- Linux 标题栏 -->
        <div class="titlebar-linux" id="titlebar-linux">
            <div class="win-title">
                <img class="win-icon" src="assets/icon.png" alt="logo">
                绘智 AI
            </div>
            <div class="win-controls">
                <button class="win-btn" id="linux-minimize" title="最小化">
                    <svg viewBox="0 0 10 10"><path d="M0 5h10" stroke="currentColor" stroke-width="1" fill="none"/></svg>
                </button>
                <button class="win-btn" id="linux-maximize" title="最大化">
                    <svg viewBox="0 0 10 10"><rect x="0.5" y="0.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1"/></svg>
                </button>
                <button class="win-btn close" id="linux-close" title="关闭">
                    <svg viewBox="0 0 10 10"><path d="M1 1l8 8M9 1L1 9" stroke="currentColor" stroke-width="1" fill="none"/></svg>
                </button>
            </div>
        </div>
        
        <!-- 终端输出区域 -->
        <div class="terminal" id="terminal"></div>
        
        <!-- 底部状态区域 -->
        <div class="status-area">
            <div class="logo-container">
                <img class="logo-img" src="assets/icon.png" alt="绘智 AI">
                <div class="logo-text">绘智 AI</div>
            </div>
            <div class="progress-container">
                <div class="progress-bar">
                    <div class="progress-fill indeterminate" id="progressFill"></div>
                </div>
            </div>
            <div class="status-title" id="statusTitle">正在启动</div>
            <div class="status-message" id="statusMessage">正在启动绘智 AI 服务...</div>
        </div>
    </div>

    <script>
        // 获取 API (通过 preload 注入)
        const api = window.splashAPI;
        
        const terminal = document.getElementById('terminal');
        const progressFill = document.getElementById('progressFill');
        const statusTitle = document.getElementById('statusTitle');
        const statusMessage = document.getElementById('statusMessage');
        
        // ============ 平台检测和标题栏设置 ============
        
        function setupTitlebar() {
            const platform = api.platform;
            
            if (platform === 'darwin') {
                // macOS: 显示标题栏，系统会自动添加交通灯
                document.getElementById('titlebar-mac').classList.add('visible');
            } else if (platform === 'win32') {
                // Windows: 显示自定义标题栏
                document.getElementById('titlebar-win').classList.add('visible');
                setupWindowsControls();
            } else {
                // Linux: 显示自定义标题栏
                document.getElementById('titlebar-linux').classList.add('visible');
                setupLinuxControls();
            }
        }
        
        function setupWindowsControls() {
            document.getElementById('win-minimize').addEventListener('click', () => {
                api.minimizeWindow();
            });
            
            document.getElementById('win-maximize').addEventListener('click', () => {
                api.maximizeWindow();
            });
            
            document.getElementById('win-close').addEventListener('click', () => {
                api.closeWindow();
            });
        }
        
        function setupLinuxControls() {
            document.getElementById('linux-minimize').addEventListener('click', () => {
                api.minimizeWindow();
            });
            
            document.getElementById('linux-maximize').addEventListener('click', () => {
                api.maximizeWindow();
            });
            
            document.getElementById('linux-close').addEventListener('click', () => {
                api.closeWindow();
            });
        }
        
        // ============ 日志和状态管理 ============
        
        function addLog(message, type = 'info') {
            const line = document.createElement('div');
            line.className = `log-line ${type}`;
            line.textContent = message;
            terminal.appendChild(line);
            terminal.scrollTop = terminal.scrollHeight;
        }
        
        function parseLogType(message) {
            const lowerMsg = message.toLowerCase();
            
            if (lowerMsg.includes('[error]') || lowerMsg.includes('error:') || lowerMsg.includes('failed')) {
                return 'error';
            }
            if (lowerMsg.includes('[warn]') || lowerMsg.includes('warning')) {
                return 'warning';
            }
            if (lowerMsg.includes('[done]') || lowerMsg.includes('successfully') || lowerMsg.includes('完成') || lowerMsg.includes('成功')) {
                return 'success';
            }
            if (lowerMsg.includes('[start]') || lowerMsg.includes('starting') || lowerMsg.includes('正在')) {
                return 'start';
            }
            if (message.includes('Path:') || message.includes('directory') || 
                message.includes('/Users/') || message.includes('/home/') || 
                message.includes('C:\\') || message.includes('D:\\')) {
                return 'path';
            }
            if (message.startsWith('**') || lowerMsg.includes('绘智')) {
                return 'highlight';
            }
            return 'info';
        }
        
        function updateStatus(title, message, progress = null) {
            if (title) statusTitle.textContent = title;
            if (message) statusMessage.textContent = message;
            
            if (progress !== null) {
                progressFill.classList.remove('indeterminate');
                progressFill.style.width = `${progress}%`;
            }
        }
        
        function addInitialLogs() {
            const startTime = new Date().toISOString().replace('T', ' ').slice(0, 19);
            const platformNames = {
                'darwin': 'Darwin (macOS)',
                'win32': 'Windows',
                'linux': 'Linux'
            };
            const platformName = platformNames[api.platform] || api.platform;
            
            addLog(`** 绘智 AI Desktop 启动时间: ${startTime}`, 'highlight');
            addLog(`** 平台: ${platformName}`, 'highlight');
            addLog(`** 架构: ${api.arch}`, 'highlight');
            addLog('', 'info');
        }
        
        // ============ IPC 监听 ============
        
        api.onLog((message) => {
            const type = parseLogType(message);
            addLog(message, type);
        });
        
        api.onStatus((message) => {
            updateStatus(null, message);
        });
        
        api.onProgress((data) => {
            if (data.percent !== undefined) {
                updateStatus(data.title, data.message, data.percent);
            } else {
                updateStatus(data.title, data.message);
            }
        });
        
        api.onError((error) => {
            addLog(`[错误] ${error}`, 'error');
            updateStatus('启动失败', error);
            progressFill.style.background = '#f87171';
            progressFill.classList.remove('indeterminate');
            progressFill.style.width = '100%';
        });
        
        // ============ 初始化 ============
        
        setupTitlebar();
        addInitialLogs();
    </script>
</body>
</html>
