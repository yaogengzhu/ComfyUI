<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>绘智 AI - 登录</title>
    <link rel="icon" type="image/png" href="/web_custom/assets/favicon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #0f172a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .login-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-img {
            width: 72px;
            height: 72px;
            border-radius: 16px;
            margin-bottom: 12px;
            object-fit: cover;
        }
        
        .logo h1 {
            color: #e2e8f0;
            font-size: 28px;
            font-weight: 700;
        }
        
        .logo p {
            color: rgba(255, 255, 255, 0.5);
            margin-top: 8px;
            font-size: 14px;
        }
        
        .tabs {
            display: flex;
            margin-bottom: 30px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 4px;
        }
        
        .tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.3s;
            font-weight: 500;
        }
        
        .tab.active {
            background: #3b82f6;
            color: #fff;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.25);
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
        }
        
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            transition: all 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.08);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        
        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }
        
        .submit-btn {
            width: 100%;
            padding: 14px;
            background: #3b82f6;
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 2px;
        }
        
        .submit-btn:hover {
            transform: translateY(-2px);
            background: #2563eb;
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.25);
        }
        
        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .message {
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
            font-size: 14px;
        }
        
        .message.error {
            background: rgba(255, 59, 48, 0.15);
            color: #ff6b6b;
            display: block;
        }
        
        .message.success {
            background: rgba(52, 199, 89, 0.15);
            color: #52c959;
            display: block;
        }
        
        .message.info {
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            display: block;
        }
        
        .form-container {
            display: none;
        }
        
        .form-container.active {
            display: block;
        }
        
        .footer {
            text-align: center;
            margin-top: 24px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 12px;
        }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .hint {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 6px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <img src="/web_custom/assets/favicon.png" alt="绘智 AI" class="logo-img" onerror="this.style.display='none'">
            <h1>绘智 AI</h1>
            <p>强大的 AI 图像生成平台</p>
        </div>
        
        <div class="tabs">
            <div class="tab active" data-tab="login">登录</div>
            <div class="tab" data-tab="register">注册</div>
        </div>
        
        <div id="message" class="message"></div>
        
        <!-- 登录表单 -->
        <div id="login-form" class="form-container active">
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>用户名 / 邮箱</label>
                    <input type="text" id="login-username" placeholder="请输入用户名或邮箱" required>
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="login-password" placeholder="请输入密码" required>
                </div>
                <button type="submit" class="submit-btn" id="login-btn">登 录</button>
            </form>
        </div>
        
        <!-- 注册表单 -->
        <div id="register-form" class="form-container">
            <form onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="register-username" placeholder="请输入用户名 (至少2个字符)" required minlength="2">
                </div>
                <div class="form-group">
                    <label>邮箱</label>
                    <input type="email" id="register-email" placeholder="请输入邮箱">
                    <p class="hint">邮箱将用于绑定 ComfyOrg 账号</p>
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="register-password" placeholder="请输入密码 (至少6个字符)" required minlength="6">
                </div>
                <div class="form-group">
                    <label>确认密码</label>
                    <input type="password" id="register-confirm" placeholder="请再次输入密码" required>
                </div>
                <button type="submit" class="submit-btn" id="register-btn">注 册</button>
            </form>
        </div>
        
        <div class="footer">
            <p>Powered by 绘智 AI</p>
        </div>
    </div>

    <script>
        // ========== 配置 ==========
        // 绘智认证服务地址 (独立的 Node.js 服务)
        const AUTH_SERVICE_URL = 'http://localhost:3001';
        // ComfyUI 后端地址
        const COMFYUI_URL = window.location.origin;

        // ========== Token 存储键名 ==========
        const STORAGE_KEYS = {
            HUIZHI_TOKEN: 'huizhi_token',           // 绘智系统 JWT
            COMFY_ORG_TOKEN: 'comfy_org_token',     // ComfyOrg Firebase Token (核心!)
            COMFY_ORG_EXPIRY: 'comfy_org_token_expiry',
            USER_INFO: 'huizhi_user',
            HUIZHI_USER_INFO: 'huizhi_user_info',   // 新增: 用于 ComfyUI 前端读取
            // 兼容旧的 key (ComfyUI 原有认证系统)
            COMFY_TOKEN: 'comfy_token',
        };

        // ========== Tab 切换 ==========
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.form-container').forEach(f => f.classList.remove('active'));
                
                tab.classList.add('active');
                document.getElementById(tab.dataset.tab + '-form').classList.add('active');
                hideMessage();
            });
        });
        
        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = 'message ' + type;
        }
        
        function hideMessage() {
            document.getElementById('message').className = 'message';
        }

        function setButtonLoading(btn, loading, text) {
            if (loading) {
                btn.disabled = true;
                btn.innerHTML = `<span class="loading-spinner"></span>${text}`;
            } else {
                btn.disabled = false;
                btn.textContent = text;
            }
        }

        // ========== 存储 Token ==========
        function saveTokens(data) {
            // 绘智系统 Token
            localStorage.setItem(STORAGE_KEYS.HUIZHI_TOKEN, data.huizhiToken);
            
            // ComfyOrg Token (最重要! 用于 API 节点)
            localStorage.setItem(STORAGE_KEYS.COMFY_ORG_TOKEN, data.comfyOrgToken);
            
            // Token 过期时间
            const expiresAt = Date.now() + (data.comfyOrgTokenExpiresIn || 3600) * 1000;
            localStorage.setItem(STORAGE_KEYS.COMFY_ORG_EXPIRY, expiresAt.toString());
            
            // 用户信息 (旧格式)
            localStorage.setItem(STORAGE_KEYS.USER_INFO, JSON.stringify(data.user));
            
            // 新增: 用户信息 (ComfyUI 前端需要的格式)
            // 包含 uid 字段，用于魔改后的 firebaseAuthStore 读取
            const huizhiUserInfo = {
                email: data.user.email || data.user.username + '@huizhi.ai',
                username: data.user.username,
                uid: data.user.id || data.user.comfyUserId || 'huizhi_' + data.user.username
            };
            localStorage.setItem(STORAGE_KEYS.HUIZHI_USER_INFO, JSON.stringify(huizhiUserInfo));
            
            // 兼容: ComfyUI 原有认证系统使用的 key
            localStorage.setItem(STORAGE_KEYS.COMFY_TOKEN, data.huizhiToken);
            localStorage.setItem('comfy_user', JSON.stringify(data.user));
            
            // 设置 Cookie (供 ComfyUI 后端中间件验证)
            document.cookie = `comfy_token=${data.huizhiToken}; path=/; max-age=${60*60*24*7}; SameSite=Strict`;
            
            console.log('[Login] Tokens saved successfully');
            console.log('[Login] huizhiUserInfo:', huizhiUserInfo);
        }

        function clearTokens() {
            Object.values(STORAGE_KEYS).forEach(key => localStorage.removeItem(key));
            localStorage.removeItem('comfy_user');
            localStorage.removeItem('comfy_refresh_token');
            document.cookie = 'comfy_token=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT';
        }

        // ========== 登录处理 ==========
        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            setButtonLoading(btn, true, '登录中...');
            
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value;
            
            console.log('[Login] Attempting login for:', username);
            console.log('[Login] Auth service URL:', AUTH_SERVICE_URL);
            
            try {
                const requestBody = JSON.stringify({ username, password });
                console.log('[Login] Request body:', requestBody);
                
                const response = await fetch(`${AUTH_SERVICE_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: requestBody
                });
                
                console.log('[Login] Response status:', response.status);
                
                const result = await response.json();
                console.log('[Login] Response data:', result);
                
                if (response.ok && result.data) {
                    saveTokens(result.data);
                    showMessage('登录成功，正在跳转...', 'success');
                    
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 800);
                } else {
                    console.error('[Login Error]', result.error || result.message);
                    showMessage(result.error || result.message || '登录失败', 'error');
                }
            } catch (err) {
                console.error('[Login] Network error:', err);
                showMessage('无法连接认证服务，请检查服务是否启动 (打开控制台查看详情)', 'error');
            } finally {
                setButtonLoading(btn, false, '登 录');
            }
        }
        
        // ========== 注册处理 ==========
        async function handleRegister(e) {
            e.preventDefault();
            
            const password = document.getElementById('register-password').value;
            const confirm = document.getElementById('register-confirm').value;
            
            if (password !== confirm) {
                showMessage('两次输入的密码不一致', 'error');
                return;
            }
            
            const btn = document.getElementById('register-btn');
            setButtonLoading(btn, true, '注册中...');
            showMessage('正在创建账号并绑定 ComfyOrg...', 'info');
            
            try {
                const response = await fetch(`${AUTH_SERVICE_URL}/api/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('register-username').value,
                        email: document.getElementById('register-email').value,
                        password: password
                    })
                });
                
                const result = await response.json();
                
                if (response.ok && result.data) {
                    // 注册成功，直接保存 Token 并登录
                    saveTokens(result.data);
                    showMessage('注册成功，正在跳转...', 'success');
                    
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 800);
                } else {
                    showMessage(result.error || result.message || '注册失败', 'error');
                }
            } catch (err) {
                console.error('Register error:', err);
                showMessage('无法连接认证服务，请检查服务是否启动', 'error');
            } finally {
                setButtonLoading(btn, false, '注 册');
            }
        }
        
        // ========== 页面初始化 ==========
        window.onload = function() {
            // 检查 URL 参数，如果有 logout=1 则清除登录状态
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('logout') === '1') {
                clearTokens();
                showMessage('已退出登录', 'success');
                history.replaceState({}, document.title, '/login');
                return;
            }
            
            // 检查是否已登录
            const huizhiToken = localStorage.getItem(STORAGE_KEYS.HUIZHI_TOKEN);
            const comfyOrgToken = localStorage.getItem(STORAGE_KEYS.COMFY_ORG_TOKEN);
            
            if (huizhiToken && comfyOrgToken) {
                // 验证 Token 是否有效
                fetch(`${AUTH_SERVICE_URL}/api/auth/me`, {
                    headers: { 'Authorization': 'Bearer ' + huizhiToken }
                }).then(res => {
                    if (res.ok) {
                        window.location.href = '/';
                    } else {
                        clearTokens();
                    }
                }).catch(() => {
                    // 认证服务不可用，但有 Token，先让用户进入
                    // 如果 Token 无效，后续操作会失败
                });
            }
        };
    </script>
</body>
</html>
