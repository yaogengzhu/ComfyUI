<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>绘智 AI - 登录</title>
    <link rel="icon" type="image/png" href="/web_custom/assets/favicon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Hiragino Sans GB', sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .login-container {
            background: #fff;
            border-radius: 8px;
            padding: 48px 40px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        }
        
        .logo {
            text-align: center;
            margin-bottom: 36px;
        }

        .logo-img {
            width: 56px;
            height: 56px;
            border-radius: 12px;
            margin-bottom: 16px;
            object-fit: cover;
        }
        
        .logo h1 {
            color: #333;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 1px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            color: #666;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 14px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 6px;
            color: #333;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #4080ff;
        }
        
        .form-group input::placeholder {
            color: #bbb;
        }
        
        .submit-btn {
            width: 100%;
            padding: 12px;
            background: #4080ff;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 8px;
        }
        
        .submit-btn:hover {
            background: #3070ee;
        }
        
        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .message {
            padding: 10px 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
            font-size: 13px;
        }
        
        .message.error {
            background: #fff2f0;
            color: #ff4d4f;
            border: 1px solid #ffccc7;
            display: block;
        }
        
        .message.success {
            background: #f6ffed;
            color: #52c41a;
            border: 1px solid #b7eb8f;
            display: block;
        }
        
        .message.warning {
            background: #fffbe6;
            color: #d48806;
            border: 1px solid #ffe58f;
            display: block;
        }
        
        .footer {
            text-align: center;
            margin-top: 32px;
            color: #bbb;
            font-size: 12px;
        }

        .loading-spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.6s linear infinite;
            margin-right: 6px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .kicked-notice {
            font-size: 12px;
            color: #666;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <img src="/web_custom/assets/favicon.png" alt="绘智 AI" class="logo-img" onerror="this.style.display='none'">
            <h1>绘智 AI</h1>
        </div>
        
        <div id="message" class="message"></div>
        
        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>用户名 / 邮箱</label>
                <input type="text" id="login-username" placeholder="请输入用户名或邮箱" required>
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="login-password" placeholder="请输入密码" required>
            </div>
            <button type="submit" class="submit-btn" id="login-btn">登录</button>
        </form>
        
        <div class="footer">
            <p>© 绘智 AI</p>
        </div>
    </div>

    <script type="module">
        // ========== Firebase SDK (PROD dreamboothy) ==========
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.3.0/firebase-app.js';
        import { getAuth, signInWithEmailAndPassword, setPersistence, browserLocalPersistence } from 'https://www.gstatic.com/firebasejs/11.3.0/firebase-auth.js';

        const FIREBASE_CONFIG = {
            apiKey: 'AIzaSyC2-fomLqgCjb7ELwta1I9cEarPK8ziTGs',
            authDomain: 'dreamboothy.firebaseapp.com',
            databaseURL: 'https://dreamboothy-default-rtdb.firebaseio.com',
            projectId: 'dreamboothy',
            storageBucket: 'dreamboothy.appspot.com',
            messagingSenderId: '357148958219',
            appId: '1:357148958219:web:f5917f72e5f36a2015310e',
            measurementId: 'G-3ZBD3MBTG4'
        };

        // 使用 unique name 避免和 Vue app 的 Firebase 冲突（同一 config 实际会复用同一实例）
        const firebaseApp = initializeApp(FIREBASE_CONFIG, 'huizhi-login');
        const firebaseAuth = getAuth(firebaseApp);
        // 设置持久化，确保登录状态保存到 IndexedDB
        await setPersistence(firebaseAuth, browserLocalPersistence);

        /**
         * 用 ComfyOrg 凭据做真正的 Firebase 登录
         * 成功后 onAuthStateChanged 在 Vue app 中会收到 user，currentUser 有值
         */
        async function firebaseSignIn(comfyCredentials) {
            if (!comfyCredentials || !comfyCredentials.email || !comfyCredentials.password) {
                console.warn('[Login] No comfyCredentials, skipping Firebase sign-in');
                return false;
            }
            try {
                console.log('[Login] Attempting Firebase signInWithEmailAndPassword for', comfyCredentials.email);
                // 注意：这里用的是 Vue app 共用的 Firebase 实例（同 config 会自动共享）
                // 但 login.html 和 Vue app 是不同页面，所以这里的登录状态会持久化到 IndexedDB
                // Vue app 加载时 onAuthStateChanged 会自动拾取
                const defaultApp = initializeApp(FIREBASE_CONFIG);
                const defaultAuth = getAuth(defaultApp);
                await setPersistence(defaultAuth, browserLocalPersistence);
                const userCredential = await signInWithEmailAndPassword(defaultAuth, comfyCredentials.email, comfyCredentials.password);
                console.log('[Login] Firebase sign-in SUCCESS! uid:', userCredential.user.uid, 'email:', userCredential.user.email);
                return true;
            } catch (err) {
                console.error('[Login] Firebase sign-in FAILED:', err.code, err.message);
                return false;
            }
        }

        // 暴露给全局，供 handleLogin 调用
        window.__firebaseSignIn = firebaseSignIn;
    </script>

    <script>
        // ========== 配置 ==========
        const AUTH_SERVICE_URL = 'http://43.138.44.254:3001';
        const COMFYUI_URL = window.location.origin;

        // ========== Token 存储键名 ==========
        const STORAGE_KEYS = {
            HUIZHI_TOKEN: 'huizhi_token',
            COMFY_ORG_TOKEN: 'comfy_org_token',
            COMFY_ORG_EXPIRY: 'comfy_org_token_expiry',
            USER_INFO: 'huizhi_user',
            HUIZHI_USER_INFO: 'huizhi_user_info',
            COMFY_TOKEN: 'comfy_token',
            // 设备信息
            DEVICE_ID: 'huizhi_device_id',
            SESSION_ID: 'huizhi_session_id',
        };
        
        // ========== 设备指纹生成 ==========
        function generateDeviceId() {
            // 检查是否已有设备 ID
            let deviceId = localStorage.getItem(STORAGE_KEYS.DEVICE_ID);
            if (deviceId) {
                return deviceId;
            }
            
            // 收集设备信息生成指纹
            const components = [
                navigator.userAgent,
                navigator.language,
                screen.width + 'x' + screen.height,
                screen.colorDepth,
                new Date().getTimezoneOffset(),
                navigator.hardwareConcurrency || 'unknown',
                navigator.platform
            ];
            
            // 生成哈希
            const str = components.join('|');
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                const char = str.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash;
            }
            
            // 添加随机数确保唯一性
            deviceId = 'device_' + Math.abs(hash).toString(36) + '_' + Date.now().toString(36);
            localStorage.setItem(STORAGE_KEYS.DEVICE_ID, deviceId);
            
            return deviceId;
        }
        
        function getDeviceInfo() {
            const ua = navigator.userAgent;
            let deviceType = 'desktop';
            let osName = 'Unknown';
            let browserName = 'Unknown';
            let deviceName = '';
            
            // 检测操作系统
            if (ua.includes('Windows')) osName = 'Windows';
            else if (ua.includes('Mac OS')) osName = 'macOS';
            else if (ua.includes('Linux')) osName = 'Linux';
            else if (ua.includes('Android')) { osName = 'Android'; deviceType = 'mobile'; }
            else if (ua.includes('iPhone') || ua.includes('iPad')) { 
                osName = 'iOS'; 
                deviceType = ua.includes('iPad') ? 'tablet' : 'mobile';
            }
            
            // 检测浏览器
            if (ua.includes('Electron')) browserName = 'Electron';
            else if (ua.includes('Chrome')) browserName = 'Chrome';
            else if (ua.includes('Firefox')) browserName = 'Firefox';
            else if (ua.includes('Safari')) browserName = 'Safari';
            else if (ua.includes('Edge')) browserName = 'Edge';
            
            // 生成设备名称
            deviceName = `${browserName} on ${osName}`;
            
            return {
                device_id: generateDeviceId(),
                device_name: deviceName,
                device_type: deviceType,
                os_name: osName,
                browser_name: browserName
            };
        }
        
        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = 'message ' + type;
        }
        
        function hideMessage() {
            document.getElementById('message').className = 'message';
        }

        function setButtonLoading(btn, loading, text) {
            if (loading) {
                btn.disabled = true;
                btn.innerHTML = `<span class="loading-spinner"></span>${text}`;
            } else {
                btn.disabled = false;
                btn.textContent = text;
            }
        }

        // ========== 存储 Token ==========
        async function saveTokens(data) {
            console.log('[Login] saveTokens called, data keys:', Object.keys(data));
            
            localStorage.setItem(STORAGE_KEYS.HUIZHI_TOKEN, data.huizhiToken);
            
            // 存储后端返回的 ComfyOrg Firebase ID Token (prod 环境)
            let comfyOrgToken = data.comfyOrgToken;
            
            // 如果后端未返回 comfyOrgToken，尝试刷新获取
            if (!comfyOrgToken || comfyOrgToken === 'null' || comfyOrgToken === 'undefined') {
                console.warn('[Login] comfyOrgToken missing, attempting refresh...');
                try {
                    const refreshResp = await fetch(`${AUTH_SERVICE_URL}/api/auth/refresh-comfy-token`, {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${data.huizhiToken}`,
                            'Content-Type': 'application/json'
                        }
                    });
                    if (refreshResp.ok) {
                        const refreshData = await refreshResp.json();
                        comfyOrgToken = refreshData.data?.comfyOrgToken;
                    }
                } catch (refreshErr) {
                    console.error('[Login] Refresh request failed:', refreshErr);
                }
            }
            
            if (comfyOrgToken && comfyOrgToken !== 'null' && comfyOrgToken !== 'undefined') {
                localStorage.setItem(STORAGE_KEYS.COMFY_ORG_TOKEN, comfyOrgToken);
                const expiresAt = Date.now() + (data.comfyOrgTokenExpiresIn || 3600) * 1000;
                localStorage.setItem(STORAGE_KEYS.COMFY_ORG_EXPIRY, expiresAt.toString());
                console.log('[Login] ComfyOrg token stored (prod Firebase ID Token)');
            } else {
                console.error('[Login] ComfyOrg token is STILL null');
                localStorage.setItem(STORAGE_KEYS.COMFY_ORG_EXPIRY, '0');
            }
            
            // 保存用户信息
            localStorage.setItem(STORAGE_KEYS.USER_INFO, JSON.stringify(data.user));
            
            const huizhiUserInfo = {
                email: data.user.email || data.user.username + '@huizhi.ai',
                username: data.user.username,
                uid: data.user.id || data.user.comfyUserId || 'huizhi_' + data.user.username
            };
            localStorage.setItem(STORAGE_KEYS.HUIZHI_USER_INFO, JSON.stringify(huizhiUserInfo));
            
            localStorage.setItem(STORAGE_KEYS.COMFY_TOKEN, data.huizhiToken);
            localStorage.setItem('comfy_user', JSON.stringify(data.user));
            
            // 保存设备和会话信息
            if (data.device_id) {
                localStorage.setItem(STORAGE_KEYS.DEVICE_ID, data.device_id);
            }
            if (data.session_id) {
                localStorage.setItem(STORAGE_KEYS.SESSION_ID, data.session_id);
            }
            
            document.cookie = `comfy_token=${data.huizhiToken}; path=/; max-age=${60*60*24*7}; SameSite=Strict`;
        }

        function clearTokens() {
            Object.values(STORAGE_KEYS).forEach(key => localStorage.removeItem(key));
            localStorage.removeItem('comfy_user');
            localStorage.removeItem('comfy_refresh_token');
            document.cookie = 'comfy_token=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT';
        }

        // ========== 登录处理 ==========
        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            setButtonLoading(btn, true, '登录中...');
            
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value;
            
            // 获取设备信息
            const deviceInfo = getDeviceInfo();
            
            try {
                const response = await fetch(`${AUTH_SERVICE_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        username, 
                        password,
                        ...deviceInfo
                    })
                });
                
                const result = await response.json();
                
                if (response.ok && result.data) {
                    console.log('[Login] Login response data:', JSON.stringify(result.data, (key, val) => {
                        if (key === 'comfyOrgToken' && val) return val.substring(0, 30) + '...(' + val.length + ' chars)';
                        if (key === 'huizhiToken' && val) return val.substring(0, 20) + '...';
                        if (key === 'comfyCredentials' && val) return { email: val.email, password: '***' };
                        return val;
                    }));
                    await saveTokens(result.data);
                    
                    // 用 ComfyOrg 凭据做真正的 Firebase 登录
                    // 这样 Vue app 的 onAuthStateChanged 会收到 user，currentUser 有值
                    if (result.data.comfyCredentials && window.__firebaseSignIn) {
                        const firebaseOk = await window.__firebaseSignIn(result.data.comfyCredentials);
                        console.log('[Login] Firebase sign-in result:', firebaseOk ? 'SUCCESS' : 'FAILED (using fallback token)');
                    } else {
                        console.warn('[Login] No comfyCredentials or Firebase SDK not loaded, using fallback external token');
                    }
                    
                    // 检查是否踢掉了其他设备
                    if (result.data.kicked_device) {
                        const kicked = result.data.kicked_device;
                        showMessage(`登录成功！已将 ${kicked.device_name} 上的登录下线`, 'warning');
                    } else {
                        showMessage('登录成功', 'success');
                    }
                    
                    // 使用绝对地址重定向到 ComfyUI 首页，避免在 Electron 环境下相对路径解析异常
                    setTimeout(() => {
                        const targetUrl = COMFYUI_URL + '/?ts=' + Date.now();
                        try {
                            window.location.replace(targetUrl);
                        } catch (e) {
                            window.location.href = targetUrl;
                        }
                    }, 800);
                } else {
                    showMessage(result.error || result.message || '登录失败', 'error');
                }
            } catch (err) {
                showMessage('无法连接服务器', 'error');
            } finally {
                setButtonLoading(btn, false, '登录');
            }
        }
        
        // ========== 页面初始化 ==========
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            
            // 检查是否被踢下线
            if (urlParams.get('kicked') === '1') {
                clearTokens();
                showMessage('您的账号已在其他设备登录，当前设备已下线', 'warning');
                history.replaceState({}, document.title, '/login');
                return;
            }
            
            if (urlParams.get('logout') === '1') {
                clearTokens();
                showMessage('已退出登录', 'success');
                history.replaceState({}, document.title, '/login');
                return;
            }
            
            const huizhiToken = localStorage.getItem(STORAGE_KEYS.HUIZHI_TOKEN);
            const comfyOrgToken = localStorage.getItem(STORAGE_KEYS.COMFY_ORG_TOKEN);
            
            if (huizhiToken && comfyOrgToken) {
                const deviceId = localStorage.getItem(STORAGE_KEYS.DEVICE_ID);
                
                fetch(`${AUTH_SERVICE_URL}/api/auth/me`, {
                    headers: { 
                        'Authorization': 'Bearer ' + huizhiToken,
                        'X-Device-ID': deviceId || ''
                    }
                }).then(res => res.json()).then(data => {
                    if (data.success) {
                        const targetUrl = COMFYUI_URL + '/?ts=' + Date.now();
                        try {
                            window.location.replace(targetUrl);
                        } catch (e) {
                            window.location.href = targetUrl;
                        }
                    } else if (data.error_code === 'device_mismatch') {
                        clearTokens();
                        showMessage('您的账号已在其他设备登录', 'warning');
                    } else {
                        clearTokens();
                    }
                }).catch(() => {
                    // 认证服务不可用，但有 Token，先让用户进入
                });
            }
        };
    </script>
</body>
</html>
