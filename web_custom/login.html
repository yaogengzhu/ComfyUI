<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComfyUI - 登录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .login-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo h1 {
            color: #fff;
            font-size: 28px;
            font-weight: 600;
        }
        
        .logo p {
            color: rgba(255, 255, 255, 0.6);
            margin-top: 8px;
        }
        
        .tabs {
            display: flex;
            margin-bottom: 30px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 5px;
        }
        
        .tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s;
        }
        
        .tab.active {
            background: #e94560;
            color: #fff;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #e94560;
            background: rgba(255, 255, 255, 0.1);
        }
        
        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }
        
        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #e94560, #c23a51);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(233, 69, 96, 0.3);
        }
        
        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
        }
        
        .message.error {
            background: rgba(255, 59, 48, 0.2);
            color: #ff6b6b;
            display: block;
        }
        
        .message.success {
            background: rgba(52, 199, 89, 0.2);
            color: #52c959;
            display: block;
        }
        
        .form-container {
            display: none;
        }
        
        .form-container.active {
            display: block;
        }
        
        .footer {
            text-align: center;
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>🎨 ComfyUI</h1>
            <p>强大的 AI 图像生成平台</p>
        </div>
        
        <div class="tabs">
            <div class="tab active" data-tab="login">登录</div>
            <div class="tab" data-tab="register">注册</div>
        </div>
        
        <div id="message" class="message"></div>
        
        <!-- 登录表单 -->
        <div id="login-form" class="form-container active">
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>用户名 / 邮箱</label>
                    <input type="text" id="login-username" placeholder="请输入用户名或邮箱" required>
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="login-password" placeholder="请输入密码" required>
                </div>
                <button type="submit" class="submit-btn" id="login-btn">登 录</button>
            </form>
        </div>
        
        <!-- 注册表单 -->
        <div id="register-form" class="form-container">
            <form onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="register-username" placeholder="请输入用户名 (至少3个字符)" required minlength="3">
                </div>
                <div class="form-group">
                    <label>邮箱</label>
                    <input type="email" id="register-email" placeholder="请输入邮箱" required>
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="register-password" placeholder="请输入密码 (至少6个字符)" required minlength="6">
                </div>
                <div class="form-group">
                    <label>确认密码</label>
                    <input type="password" id="register-confirm" placeholder="请再次输入密码" required>
                </div>
                <button type="submit" class="submit-btn" id="register-btn">注 册</button>
            </form>
        </div>
        
        <div class="footer">
            <p>Powered by ComfyUI</p>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        
        // Tab 切换
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.form-container').forEach(f => f.classList.remove('active'));
                
                tab.classList.add('active');
                document.getElementById(tab.dataset.tab + '-form').classList.add('active');
                hideMessage();
            });
        });
        
        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = 'message ' + type;
        }
        
        function hideMessage() {
            document.getElementById('message').className = 'message';
        }
        
        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            btn.disabled = true;
            btn.textContent = '登录中...';
            
            try {
                const response = await fetch(API_BASE + '/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('login-username').value,
                        password: document.getElementById('login-password').value
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // 保存 Token 到 localStorage
                    localStorage.setItem('comfy_token', data.data.token);
                    localStorage.setItem('comfy_refresh_token', data.data.refresh_token);
                    localStorage.setItem('comfy_user', JSON.stringify(data.data.user));
                    
                    // 同时设置 Cookie (供服务器端认证使用)
                    document.cookie = `comfy_token=${data.data.token}; path=/; max-age=${60*60*24*7}; SameSite=Strict`;
                    
                    showMessage('登录成功，正在跳转...', 'success');
                    
                    // 跳转到主页
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 1000);
                } else {
                    showMessage(data.message || '登录失败', 'error');
                }
            } catch (err) {
                showMessage('网络错误，请重试', 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = '登 录';
            }
        }
        
        async function handleRegister(e) {
            e.preventDefault();
            
            const password = document.getElementById('register-password').value;
            const confirm = document.getElementById('register-confirm').value;
            
            if (password !== confirm) {
                showMessage('两次输入的密码不一致', 'error');
                return;
            }
            
            const btn = document.getElementById('register-btn');
            btn.disabled = true;
            btn.textContent = '注册中...';
            
            try {
                const response = await fetch(API_BASE + '/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('register-username').value,
                        email: document.getElementById('register-email').value,
                        password: password
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showMessage('注册成功，请登录', 'success');
                    // 切换到登录表单
                    setTimeout(() => {
                        document.querySelector('.tab[data-tab="login"]').click();
                    }, 1500);
                } else {
                    showMessage(data.message || '注册失败', 'error');
                }
            } catch (err) {
                showMessage('网络错误，请重试', 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = '注 册';
            }
        }
        
        // 检查是否已登录
        window.onload = function() {
            // 检查 URL 参数，如果有 logout=1 则清除登录状态
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('logout') === '1') {
                localStorage.removeItem('comfy_token');
                localStorage.removeItem('comfy_refresh_token');
                localStorage.removeItem('comfy_user');
                document.cookie = 'comfy_token=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT';
                showMessage('已退出登录', 'success');
                // 清除 URL 参数
                history.replaceState({}, document.title, '/login');
                return;
            }
            
            const token = localStorage.getItem('comfy_token');
            if (token) {
                // 验证 Token
                fetch(API_BASE + '/api/auth/me', {
                    headers: { 'Authorization': 'Bearer ' + token }
                }).then(res => res.json()).then(data => {
                    if (data.success) {
                        window.location.href = '/';
                    } else {
                        // Token 无效，清除
                        localStorage.removeItem('comfy_token');
                        localStorage.removeItem('comfy_refresh_token');
                        localStorage.removeItem('comfy_user');
                        document.cookie = 'comfy_token=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT';
                    }
                }).catch(() => {
                    // 网络错误，不清除 token，可能只是暂时性问题
                });
            }
        };
    </script>
</body>
</html>
